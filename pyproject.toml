[project]
name = "auramem"
version = "0.1.0"
description = "Self-hosted long-term memory layer for LLMs"
readme = "docs/plan.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "dateparser>=1.4.3",
    "fastapi>=0.162.0",
    "httpx>=0.28",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.17",
    "neo4j>=5.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sentence-transformers>=6.2.0",
    "torch>=2.11.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[neo4j,redis]>=4.9",
    "types-dateparser>=1.4.3.20260907",
]

# Reranker runtime: CUDA wheels on Windows (local GPU), CPU wheels on Linux (CI).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["memory", "auramem"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (testcontainers)",
    "ollama: needs a running Ollama with the embedding model (skipped if unreachable)",
    "llm: calls the Claude API (costs money); opt in with -m llm",
]
